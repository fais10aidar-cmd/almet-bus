<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Автобусы Альметьевска</title>
  <link rel="manifest" href="manifest.json">
  <meta name="theme-color" content="#007aff">
  <link rel="apple-touch-icon" href="apple-touch-icon.png">
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css">
  <link rel="stylesheet" href="style.css">
  <link rel="stylesheet" href="light.css">
  <script>
    // Ловец ошибок — покажет любую проблему красной плашкой сверху
    window.onerror = function (msg, src, line) {
      var el = document.getElementById('jsError');
      if (!el) {
        el = document.createElement('div');
        el.id = 'jsError';
        el.style.cssText = 'position:fixed;top:0;left:0;right:0;z-index:99999;' +
          'background:#e53935;color:#fff;padding:10px 14px;font-size:13px;';
        (document.body || document.documentElement).appendChild(el);
      }
      el.textContent = 'Ошибка скрипта: ' + msg + ' (' + (src || '?') + ':' + line + ')';
    };
  </script>
</head>
<body>
  <div id="app">
    <section id="tab-schedule" class="tab">
      <h2>Расписание</h2>
      <div id="scheduleList"></div>
    </section>

    <section id="tab-map" class="tab active">
      <div id="map"></div>
      <button id="routePickerBtn" aria-label="Показать список маршрутов">
  <svg class="ico-bus" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
    <rect x="4" y="3" width="16" height="14" rx="2.5"/><path d="M4 10h16"/><path d="M8 14h.01M16 14h.01"/><circle cx="7.5" cy="19.5" r="1.5"/><circle cx="16.5" cy="19.5" r="1.5"/>
  </svg>
  Маршруты
</button>
      <div id="routePicker"></div>
    </section>

    <section id="tab-chat" class="tab">
      <h2>Чат</h2>
      <div id="chatRoot"></div>
    </section>

    <section id="tab-games" class="tab">
      <h2>Игры</h2>
      <div id="gameRoot"></div>
    </section>

    <section id="tab-settings" class="tab">
      <h2>Настройки</h2>

      <div class="a11y-box">
        <label class="a11y-toggle">
          <input type="checkbox" id="a11yMode">
          <span>Режим для слабовидящих</span>
        </label>
        <p class="hint">Крупный шрифт, высокий контраст, большие кнопки. Анимации отключаются. Настройка запоминается.</p>
      </div>

      <!-- Редактор остановок: скрыт, показывается только в админ-режиме (/admin) -->
      <div id="stopsEditor" style="display:none">
        <label><input type="checkbox" id="stopMarkers"> Показать остановки для правки</label><br>
        <button id="addStopBtn">+ Остановка</button>
        <button id="exportStopsBtn">Сохранить stops.js</button>
        <p class="hint">Добавление: нажми «+ Остановка», затем кликни по карте. Точки на карте таскаются мышкой.</p>
      </div>
    </section>
  </div>

  <div id="sheet">
    <div class="sheet-handle"></div>
    <div class="sheet-content">
      <h3 id="sheetTitle">Остановка</h3>
      <div class="sheet-label">Приедут автобусы:</div>
      <div id="sheetRoutes"></div>
      <div id="sheetArrivals"></div>
      <div id="sheetCoords"></div>
    </div>
  </div>

 <nav id="tabbar">
  <button data-tab="schedule" aria-label="Расписание">
    <svg class="ico" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
      <circle cx="12" cy="12" r="9"/><path d="M12 7v5l3 3"/>
    </svg>
    <span>Расписание</span>
  </button>
  <button data-tab="map" class="active" aria-label="Карта">
    <svg class="ico" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
      <path d="M9 4 3 6v14l6-2 6 2 6-2V4l-6 2-6-2z"/><path d="M9 4v14M15 6v14"/>
    </svg>
    <span>Карта</span>
  </button>
  <button data-tab="chat" aria-label="Чат">
    <svg class="ico" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
      <path d="M21 12a8 8 0 0 1-8 8H4l2.2-2.6A8 8 0 1 1 21 12z"/>
    </svg>
    <span>Чат</span>
  </button>
  <button data-tab="games" aria-label="Игры">
    <svg class="ico" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
      <path d="M6 9h12a4 4 0 0 1 4 4 4 4 0 0 1-4 4c-1.4 0-2.2-.8-3-2H9c-.8 1.2-1.6 2-3 2a4 4 0 0 1-4-4 4 4 0 0 1 4-4z"/>
      <path d="M8 11v4M6 13h4"/><path d="M16.5 12.5h.01M18.5 14.5h.01"/>
    </svg>
    <span>Игры</span>
  </button>
  <button data-tab="settings" aria-label="Настройки">
    <svg class="ico" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
      <path d="M4 8h10M18 8h2M4 16h2M10 16h10"/>
      <circle cx="16" cy="8" r="2"/><circle cx="8" cy="16" r="2"/>
    </svg>
    <span>Настройки</span>
  </button>
</nav>


<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
<script>var ROUTES_EXTRA = [];</script>

<script src="js/icons.js"></script>
<script src="routes/stops.js"></script>
<script src="routes/trolleybus_1.js"></script>
<script src="routes/trolleybus_3.js"></script>
<script src="routes/trolleybus_7a.js"></script>
<script src="routes/trolleybus_7b.js"></script>
<script src="routes/bus_2.js"></script>
<script src="routes/2b.js"></script>
<script src="routes/bus_4.js"></script>
<script src="routes/bus_4b.js"></script>
<script src="routes/bus_5c.js"></script>
<script src="routes/bus_6.js"></script>
<script src="routes/bus_8.js"></script>
<script src="routes/bus_8b.js"></script>
<script src="js/schedule.js"></script>
<script src="js/editor.js"></script>
<script src="js/accessibility.js"></script>
<script src="js/darkmode.js"></script>
<script src="js/routes.js"></script>
<script src="js/main.js"></script>
<script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-app.js"></script>
<script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-database.js"></script>
<script src="js/chat-moderation.js"></script>
<script src="js/chat.js"></script>
<script src="js/games.js"></script>
<script src="js/snake.js"></script>
<script src="js/tetris.js"></script>
<script src="js/whereami.js"></script>
<script src="js/map.js"></script>
<script src="js/install.js"></script>
<script>
  if ('serviceWorker' in navigator) {
    navigator.serviceWorker.register('sw.js').catch(function () {});
  }
</script>
</body>
</html>
