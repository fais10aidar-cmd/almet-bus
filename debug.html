<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="utf-8">
<title>Отладка точек маршрута</title>
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css">
<style>
  html, body { height: 100%; margin: 0; font-family: sans-serif; }
  #map { height: 100%; }
  #panel {
    position: absolute; top: 10px; left: 10px; z-index: 1000;
    background: #fff; padding: 8px 12px; border-radius: 8px;
    box-shadow: 0 1px 4px rgba(0,0,0,.3); font-size: 14px;
  }
  #panel select { margin-left: 6px; padding: 2px 4px; }
  #panel label { margin-left: 12px; }
  #out {
    position: absolute; bottom: 10px; left: 10px; right: 10px; z-index: 1000;
    background: #fff; padding: 8px; border-radius: 8px;
    box-shadow: 0 1px 4px rgba(0,0,0,.3); display: none;
  }
  #out textarea { width: 100%; height: 90px; box-sizing: border-box; font-family: monospace; font-size: 11px; }
  #err {
    position: absolute; bottom: 120px; left: 10px; right: 10px; z-index: 1000;
    background: #fdecea; color: #8a1c11; padding: 8px 12px; border-radius: 8px;
    font-size: 14px; display: none;
  }
</style>
</head>
<body>
<div id="panel">
  Маршрут:
  <select id="routeSelect">
    <option value="routes/2b.js">2Б</option>
    <option value="routes/bus_2.js">А 2</option>
    <option value="routes/bus_4.js">А 4</option>
    <option value="routes/bus_4b.js">А 4Б</option>
    <option value="routes/bus_5c.js">А 5с</option>
    <option value="routes/bus_6.js">А 6</option>
    <option value="routes/bus_8.js">А 8</option>
    <option value="routes/bus_8b.js">А 8б</option>
    <option value="routes/trolleybus_1.js">Тб 1</option>
    <option value="routes/trolleybus_3.js">Тб 3</option>
    <option value="routes/trolleybus_7a.js">Тб 7А</option>
    <option value="routes/trolleybus_7b.js">Тб 7Б</option>
  </select>
  <label><input type="checkbox" id="drawMode"> Рисовать вручную</label>
  <button id="exportBtn">Скопировать линию</button>
  <button id="undoBtn">Отменить точку</button>
</div>
<div id="map"></div>
<div id="err"></div>
<div id="out"><textarea id="outText"></textarea></div>

<script>window.ROUTES_EXTRA = [];</script>
<script id="routeScript" src="routes/bus_5c.js"></script>

<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
<script>
  const map = L.map('map').setView([54.90, 52.30], 13);
  L.tileLayer('https://core-renderer-tiles.maps.yandex.net/tiles?l=map&x={x}&y={y}&z={z}&scale=1&projection=web_mercator&lang=ru_RU', {
    attribution: '© Яндекс'
  }).addTo(map);

  const select = document.getElementById('routeSelect');
  const errBox = document.getElementById('err');
  const drawModeBox = document.getElementById('drawMode');
  const outBox = document.getElementById('out');
  const outText = document.getElementById('outText');

  function showError(text) {
    errBox.textContent = text;
    errBox.style.display = 'block';
  }

  let layers = [];
  let manualLine = [];
  let manualLayers = [];

  function clearLayers() {
    layers.forEach(l => map.removeLayer(l));
    layers = [];
  }

  function clearManual() {
    manualLayers.forEach(l => map.removeLayer(l));
    if (manualLayers._poly) map.removeLayer(manualLayers._poly);
    manualLayers = [];
  }

  function drawRoute() {
    clearLayers();
    clearManual();
    manualLine = [];
    errBox.style.display = 'none';
    outBox.style.display = 'none';

    const route = ROUTES_EXTRA.find(r => r.points || r.segments);
    if (!route) {
      showError('Ни у одного маршрута нет points или segments.');
      return;
    }

    const segments = route.segments || [{ points: route.points }];
    const color = route.color || '#d53e4f';
    let idx = 0;
    let first = null, last = null;

    segments.forEach(seg => {
      if (seg.line && seg.line.length > 1) {
        L.polyline(seg.line, { color, weight: 4, opacity: 0.85 }).addTo(map);
        seg.line.forEach(p => {
          const m = L.circleMarker(p, {
            radius: 5, color: '#000', weight: 1,
            fillColor: '#ffb03b', fillOpacity: 1
          }).addTo(map).bindTooltip(String(idx), { permanent: true, direction: 'top' });
          layers.push(m);
          idx++;
        });
        if (!first) first = seg.line[0];
        last = seg.line[seg.line.length - 1];
      } else if (seg.points && seg.points.length) {
        seg.points.forEach(p => {
          const m = L.circleMarker(p, {
            radius: 7, color: '#000', weight: 2,
            fillColor: '#ff3b30', fillOpacity: 1
          }).addTo(map).bindTooltip(String(idx), { permanent: true, direction: 'top' });
          layers.push(m);
          idx++;
        });
        if (!first) first = seg.points[0];
        last = seg.points[seg.points.length - 1];
        if (seg.points.length > 1) {
          fetch('https://router.project-osrm.org/route/v1/driving/' +
            seg.points.map(c => c[1] + ',' + c[0]).join(';') +
            '?overview=full&geometries=geojson')
            .then(r => r.json())
            .then(data => {
              if (data.code !== 'Ok') throw new Error(data.code);
              const seg = data.routes[0].geometry.coordinates.map(c => [c[1], c[0]]);
              L.polyline(seg, { color, weight: 4, opacity: 0.7 }).addTo(map);
            })
            .catch(e => showError('OSRM не построил маршрут: ' + e.message));
        }
      }
    });

    if (first && last) {
      map.fitBounds(L.latLngBounds(first, last), { padding: [40, 40] });
    }
  }

  function redrawManual() {
    manualLine.forEach(p => {
      const m = L.circleMarker(p, {
        radius: 4, color: '#1a73e8', weight: 2,
        fillColor: '#8ab4f8', fillOpacity: 1
      }).addTo(map);
      manualLayers.push(m);
    });
    if (manualLine.length > 1) {
      manualLayers._poly = L.polyline(manualLine, { color: '#1a73e8', weight: 3, opacity: 0.8 }).addTo(map);
    }
  }

  map.on('click', e => {
    const p = [e.latlng.lat, e.latlng.lng];

    if (drawModeBox.checked) {
      manualLine.push(p);
      clearManual();
      redrawManual();
      return;
    }

    const coords = `[${e.latlng.lat.toFixed(6)}, ${e.latlng.lng.toFixed(6)}]`;
    const m = L.circleMarker(e.latlng, {
      radius: 5, color: '#1a73e8', weight: 2,
      fillColor: '#8ab4f8', fillOpacity: 1
    }).addTo(map).bindPopup(
      coords + '<br><button onclick="navigator.clipboard.writeText(\'' + coords + '\')">Скопировать</button>'
    );
    layers.push(m);
    m.openPopup();
  });

  // правый клик в режиме рисования — удалить ближайшую вершину
  map.on('contextmenu', e => {
    if (!drawModeBox.checked || !manualLine.length) return;
    let best = 0, bestDist = Infinity;
    manualLine.forEach((p, i) => {
      const d = map.distance(e.latlng, p);
      if (d < bestDist) { bestDist = d; best = i; }
    });
    manualLine.splice(best, 1);
    clearManual();
    redrawManual();
  });

  document.getElementById('exportBtn').addEventListener('click', () => {
    if (manualLine.length < 2) {
      showError('Сначала нарисуй линию: включи «Рисовать вручную» и кликни хотя бы 2 точки');
      return;
    }
    const js = 'line: [\n' + manualLine.map(p =>
      '        [' + p[0].toFixed(6) + ', ' + p[1].toFixed(6) + ']'
    ).join(',\n') + '\n      ]';
    outText.value = js;
    outBox.style.display = 'block';
    outText.select();
    try { document.execCommand('copy'); } catch (e) {}
  });

  document.getElementById('undoBtn').addEventListener('click', () => {
    if (!manualLine.length) return;
    manualLine.pop();
    clearManual();
    redrawManual();
  });

  select.addEventListener('change', () => {
    ROUTES_EXTRA.length = 0;
    const old = document.getElementById('routeScript');
    if (old) old.remove();
    const s = document.createElement('script');
    s.id = 'routeScript';
    s.src = select.value;
    s.onload = drawRoute;
    s.onerror = () => showError('Не удалось загрузить ' + select.value + ' — проверь путь');
    document.body.appendChild(s);
  });

  if (window.ROUTES_EXTRA.length) {
    drawRoute();
  } else {
    setTimeout(() => { if (!ROUTES_EXTRA.length) showError('Файл routes/bus_5c.js не загрузился — проверь, что он лежит в папке routes'); }, 1500);
  }
</script>
</body>
</html>
